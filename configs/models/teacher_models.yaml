    local_dir: LLM/meta-llama/meta-llama-3-8b-instruct
    load_mode: bf16_cuda
    gated: true
  mistral_7b:
    repo_id: mistralai/Mistral-7B-Instruct-v0.2
    local_dir: LLM/mistralai/mistral-7b-instruct-v0-2
