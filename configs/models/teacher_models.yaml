  glm4_9b:
    repo_id: zai-org/glm-4-9b-chat-hf
    local_dir: LLM/glm-4-9b-chat
    load_mode: bf16_cuda_short_context
  phi4_14b:
    repo_id: microsoft/phi-4
    local_dir: LLM/phi-4
    load_mode: bf16_auto_offload
  qwen2_5_14b_1m:
    repo_id: Qwen/Qwen2.5-14B-Instruct-1M
    local_dir: LLM/Qwen2.5-14B-Instruct-1M
