schema_version: 1
progressive_judge:
  manifest: attack_pattern_library/manifest.yaml
  query_patterns: [direct_rag_mia, s2_mia, masked_mia, ia]
  session_patterns: [direct_rag_mia, s2_mia, masked_mia, ia]
  prompt_version: progressive_v3_binary_logprob_strict_validated_attack_evidence
  max_candidate_patterns: 2
  max_retries: 1
  screening_max_tokens: 128
  detail_max_tokens: 160
  rubric_max_tokens: 128
  # A/B are verified to append as one Qwen token after the final prompt colon.
  logprob_labels: [A, B]
  logprob_scoring: binary_attack_probability
  allowed_partitions: [train, validation]
