[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miaguard"
version = "0.1.0"
description = "Local Ollama-based RAG membership inference experiments"
requires-python = ">=3.10,<3.12"
dependencies = [
  "PyYAML>=6.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "datasketch>=1.6",
  "jsonschema>=4.20",
  "lm-format-enforcer==0.11.3",
  "requests>=2.31",
  "faiss-cpu>=1.8",
]

[project.scripts]
miaguard = "miaguard.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]
analysis = [
  "pandas>=2.3,<3",
  "scipy>=1.15,<2",
  "matplotlib>=3.10,<4",
  "pyarrow>=20,<22",
]
models = [
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.49.2,<0.50",
  "huggingface-hub>=0.36,<1",
  "psutil>=5.9",
  "protobuf>=5",
  "safetensors>=0.4",
  "sentence-transformers>=3.3,<6",
  "sentencepiece>=0.2",
  "transformers>=4.57,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
